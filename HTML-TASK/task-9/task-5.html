<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Showcase</title>
</head>

<body>
    <header>
        <h1>Media Showcase</h1>
    </header>

    <main>
        <!-- Images Section -->
        <section>
            <h2>Image Gallery</h2>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgI3fF6_ebdidZr1lnTEvKusZLVuw2ZKsrhm_Xtxn6ZdQlOo9PBRq1v2VW&s=10"
                alt="Beautiful Mountain" width="300" height="200" />
            <img src="https://media.licdn.com/dms/image/v2/D4D12AQH9zP6UixRJQw/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1674648769474?e=2147483647&v=beta&t=z6sJu-2SM_Xlupwfi-QvrPrL58S2Nlgas-ob6aPHsfU"
                alt="Sunset Beach" width="300" height="200" />
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRv1a3iA8eqCsB_s3Yh8XJDVgN4H1KCwnuaqegb-YG-ynm2uEXXS2smE68B&s=10"
                alt="Green Forest" width="300" height="200" />
        </section>

        <!-- Audio Section -->
        <section>
            <h2>Audio Player</h2>
            <audio controls>
                <source src="assert/audio/1.mp3" type="audio/mp3" />
                Your browser does not support the audio element.
            </audio>
        </section>

        <!-- Video Section -->
        <section>
            <h2>Video Player</h2>
            <video width="500" height="300" controls poster="assert/image/1.jpg">
                <source src="assert/video/1.mp4" type="video/mp4" />
                Your browser does not support the video tag.
            </video>
        </section>

        <!-- YouTube Section -->
        <section>
            <h2>YouTube Video</h2>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/Q-_cu_78eIA?si=QdxECE1Uoino7P0i"
                title="YouTube video player" frameborder="0" allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          " referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>

        <!-- Google Map Section -->
        <section>
            <h2>Google Map</h2>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3886.9635174977457!2d80.20188717373304!3d13.037994213421833!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a526752db8ffe35%3A0x7f6a2a2d0ebbdc94!2sSoftlogic!5e0!3m2!1sen!2sin!4v1784798632848!5m2!1sen!2sin"
                width="600" height="450" style="border: 0" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>

        <!-- PDF Section -->
        <section>
            <h2>Embedded PDF</h2>
            <iframe src="assert/document/1.pdf" width="600" height="500"> </iframe>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 By CodeX . All Rights Reserved.</p>
    </footer>
</body>

</html>
