<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>

    <h2>Feedback Form</h2>

    <form method="post">

        <label for="fullname">Full Name:</label>
        <br>
        <input type="text" id="fullname" name="fullname" required>
        <br><br>

        <label for="email">Email:</label>
        <br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label>Rating:</label>
        <br>

        <input type="radio" id="excellent" name="rating" value="Excellent" required>
        <label for="excellent">Excellent</label>
        <br>

        <input type="radio" id="good" name="rating" value="Good">
        <label for="good">Good</label>
        <br>

        <input type="radio" id="average" name="rating" value="Average">
        <label for="average">Average</label>
        <br>

        <input type="radio" id="poor" name="rating" value="Poor">
        <label for="poor">Poor</label>
        <br><br>

        <label for="suggestions">Suggestions:</label>
        <br>
        <textarea id="suggestions" name="suggestions" rows="5" cols="30" required></textarea>
        <br><br>

        <input type="submit" value="Submit Feedback">

    </form>

</body>
</html>
