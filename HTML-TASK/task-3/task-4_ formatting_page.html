<!DOCTYPE html>
<html>
<head>
    <title>Formatting Tags</title>
</head>
<body>

    <p>
        This is a <b>bold</b> word and this is an <i>italic</i> word.
    </p>

    <p>
        HTML is <strong>important</strong> and <em>easy to learn</em>.
    </p>

    <p>
        Water is written as H<sub>2</sub>O and x<sup>2</sup> is a square.
    </p>

    <p>
        This is <mark>highlighted text</mark> and this is <u>underlined text</u>.
    </p>

    <p>
        The original price was <del>₹1000</del> and the new price is <ins>₹800</ins>.
    </p>

</body>
</html>
