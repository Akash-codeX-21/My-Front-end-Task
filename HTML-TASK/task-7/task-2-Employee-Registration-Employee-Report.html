<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration & Employee Report</title>
</head>
<body>

    <h2>Employee Registration Form</h2>

    <form>

        <label for="empid">Employee ID:</label><br>
        <input type="text" id="empid" name="empid"><br><br>

        <label for="empname">Employee Name:</label><br>
        <input type="text" id="empname" name="empname"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="mobile">Mobile:</label><br>
        <input type="tel" id="mobile" name="mobile"><br><br>

        <label for="department">Department:</label><br>
        <select id="department" name="department">
            <option>--Select Department--</option>
            <option>Software Development</option>
            <option>Testing</option>
            <option>HR</option>
            <option>Support</option>
        </select><br><br>

        <label for="experience">Experience (Years):</label><br>
        <input type="number" id="experience" name="experience"><br><br>

        <label for="salary">Salary:</label><br>
        <input type="number" id="salary" name="salary"><br><br>

        <label>Skills:</label><br>
        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label>

        <input type="checkbox" id="python" name="skills" value="Python">
        <label for="python">Python</label>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>

        <input type="checkbox" id="sql" name="skills" value="SQL">
        <label for="sql">SQL</label><br><br>

        <label for="resume">Resume Upload:</label><br>
        <input type="file" id="resume" name="resume"><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

    <br><br>

    <h2>Employee Report</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Employee ID</th>
                <th>Employee Name</th>
                <th>Department</th>
                <th>Experience</th>
                <th>Salary</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>EMP101</td>
                <td>akash</td>
                <td>Software Development</td>
                <td>3 Years</td>
                <td>50000</td>
                <td>Active</td>
            </tr>

            <tr>
                <td>EMP102</td>
                <td>anu</td>
                <td>Testing</td>
                <td>2 Years</td>
                <td>40000</td>
                <td>Active</td>
            </tr>

            <tr>
                <td>EMP103</td>
                <td>Arun Kumar</td>
                <td>HR</td>
                <td>5 Years</td>
                <td>60000</td>
                <td>Pending</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
