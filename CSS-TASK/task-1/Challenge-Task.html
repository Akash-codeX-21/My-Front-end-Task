<!DOCTYPE html>
<html>
<head>
    <title>Five Colored Boxes</title>

    <style>
        .box {
            width: 250px;
            height: 150px;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>

    <div class="box" style="background-color: red;">
        <h2>Red Box</h2>
        <p>This is the red box.</p>
    </div>

    <div class="box" style="background-color: blue;">
        <h2>Blue Box</h2>
        <p>This is the blue box.</p>
    </div>

    <div class="box" style="background-color: green;">
        <h2>Green Box</h2>
        <p>This is the green box.</p>
    </div>

    <div class="box" style="background-color: orange;">
        <h2>Orange Box</h2>
        <p>This is the orange box.</p>
    </div>

    <div class="box" style="background-color: purple;">
        <h2>Purple Box</h2>
        <p>This is the purple box.</p>
    </div>

</body>
</html>
