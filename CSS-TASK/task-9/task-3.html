<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Lift Effect</title>
    <link rel="stylesheet" href="assets/css/tast-3.css">
</head>
<body>

    <div class="products">

        <div class="card">
            <img src="assets/image/Headphones.webp" alt="Product 1">
            <h3>Headphones</h3>
            <p>Rs : 1999</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <img src="assets/image/Smart_Watch.jpg" alt="Product 2">
            <h3>Smart Watch</h3>
            <p>Rs :1799</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <img src="assets/image/Bluetooth_Speaker.jpg" alt="Product 3">
            <h3>Bluetooth Speaker</h3>
            <p>Rs :15999</p>
            <button>Buy</button>
        </div>

        <div class="card">
            <img src="assets/image/Wireless_Mouse.jpg" alt="Product 4">
            <h3>Wireless Mouse</h3>
            <p>Rs : 599</p>
            <button>Buy</button>
        </div>

    </div>

</body>
</html>
