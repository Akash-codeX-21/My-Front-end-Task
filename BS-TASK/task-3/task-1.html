<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>


    <header>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"> My Website </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#cards">Cards</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#carousel">Gallery</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    </header>
    

    <section id="carousel">
        <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
            <!-- Indicators -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>

                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>

                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
            </div>

            <!-- Images -->
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://t3.ftcdn.net/jpg/07/32/10/84/360_F_732108454_CAI9mrp1oqJrLx2HN178zAxMUniE0fLl.jpg" class="d-block w-100" alt="" />

                    <div class="carousel-caption">
                        <h2>Beautiful Devil</h2>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQM3UoF4lY0Bcp-VYK0Mh2huGFHUs9m8eXumh_6XQc-f-WwYsQRdWunk8&s=10" class="d-block w-100" alt="" />

                    <div class="carousel-caption">
                        <h2 >Nature Queen</h2>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQVrCiaSRqwV1QZcfoYL6Yq_vGOkFHYWhNUW_olKmqMEWFYwyWMU3kEiU&s=10" class="d-block w-100" alt="" />

                    <div class="carousel-caption">
                        <h2>Peaceful Places</h2>
                    </div>
                </div>
            </div>

            <!-- Previous Button -->
            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <!-- Next Button -->
            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </section>



    <section id="cards" class="py-5">
        <div class="container">
            <h2 class="text-center mb-4">Our Cards</h2>

            <div class="row g-4">
                <!-- Card 1 -->
                <div class="col-md-4">
                    <div class="card h-100 shadow">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFeK_HlrjyxPODPcsHikssfeVV1vwh_QwN4p8sdXRyf-t6bdgtgNiU4ZX1&s=10" class="card-img-top" alt="Nature" />

                        <div class="card-body">
                            <h5 class="card-title">thakitho</h5>

                            <a href="#" class="btn btn-primary"> Read More </a>
                        </div>
                    </div>
                </div>



                <div class="col-md-4">
                    <div class="card h-100 shadow">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1qlKWDpXoWN-7SmA_byyIG68-Z6VQ8Xq0-FVubQekPw&s" class="card-img-top" alt="Mountain" />

                        <div class="card-body">
                            <h5 class="card-title">kisami</h5>

                            <a href="#" class="btn btn-success"> Read More </a>
                        </div>
                    </div>
                </div>


                <div class="col-md-4">
                    <div class="card h-100 shadow">
                        <img src="https://i.pinimg.com/1200x/4a/a0/85/4aa08588f788128ab892d4de72d09f84.jpg" class="card-img-top" alt="Travel" />

                        <div class="card-body">
                            <h5 class="card-title">kari</h5>

                            <a href="#" class="btn btn-danger"> Read More </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>



    <section id="contact" class="bg-light py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <h2 class="text-center mb-4">Contact Form</h2>

                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label"> Name </label>

                            <input type="text" class="form-control" id="name" placeholder="Enter your name" />
                        </div>


                        <div class="mb-3">
                            <label for="email" class="form-label"> Email </label>

                            <input type="email" class="form-control" id="email" placeholder="Enter your email" />
                        </div>


                        <div class="mb-3">
                            <label for="password" class="form-label"> Password </label>

                            <input type="password" class="form-control" id="password"
                                placeholder="Enter your password" />
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label"> Message </label>

                            <textarea class="form-control" id="message" rows="4" placeholder="Enter your message">
                </textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Submit
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 Made by heart less</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
